<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News | Diocese of Boac</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: '#6a1f2b',
            'maroon-deep': '#4a1420',
            gold: '#b4863f',
            'gold-light': '#d9b877',
            parchment: '#f6f0e4',
            'parchment-dark': '#ece2cd',
            ink: '#2a2420',
            'ink-soft': '#5c5147',
            white: '#fffdf9',
          },
          fontFamily: {
            newsreader: ['Newsreader', 'serif'],
            fraunces: ['Fraunces', 'serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .eyebrow {
        @apply font-mono text-[0.7rem] sm:text-[0.72rem] tracking-[0.14em] sm:tracking-[0.16em] uppercase text-gold font-medium;
      }
    }
    html { scroll-behavior: smooth; }
  </style>
</head>

<body class="font-newsreader text-ink bg-parchment leading-relaxed overflow-x-hidden">

  <div id="utility-bar"></div>
  <header id="site-header"></header>
  <main id="page-content"></main>
  <footer id="site-footer"></footer>

  <script src="site-data.js"></script>
  <script src="renderer.js"></script>
  <script>initPage('news');</script>
</body>

</html>
